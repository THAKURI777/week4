<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Image Slider</title>

        <link rel="stylesheet" href="assig.css">
    </head>

    <body>
        <h1>Image Slider</h1>

        <div class="slider">

            <!-- Previous Button -->
            <button id="previous"><</button>

            <!-- Image Area -->
            <div class="slider-window">

                <div class="slider-track">

                    <img src="1.jpg"
                        alt="Mountain landscape">

                    <img src="2.jpg"
                        alt="Lake landscape">

                    <img src="3.jpg"
                        alt="City landscape">

                    <img src="4.jpg"
                        alt="Forest landscape">

                </div>

            </div>

            <button id="next">></button>

        </div>

        <div id="dots"></div>

        <script src="assig.js"></script>

    </body>

</html>
